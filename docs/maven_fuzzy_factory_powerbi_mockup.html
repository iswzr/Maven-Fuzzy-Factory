<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maven Fuzzy Factory — Power BI Mockup Blueprint</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--nat:#2563eb;--den:#7c3aed;--htm:#ea580c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#0b1020}
.hd{max-width:1360px;margin:auto;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{color:#fff;font-weight:700}.brand small{display:block;font-weight:400;font-size:11px;color:#94a3b8}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav button{background:none;border:0;color:#cbd5e1;padding:5px 10px;border-radius:8px;font:inherit;font-size:12.5px;cursor:pointer}
nav button:hover{background:#1b2440}nav button.on{background:#2dd4bf;color:#042f2e;font-weight:600}
nav i{width:1px;height:18px;background:#2a3558;margin:0 6px}
main{max-width:1360px;margin:auto;padding:24px 20px 70px}
.tab{display:none}.tab.on{display:block}
h1{font-size:28px;margin:4px 0 8px;line-height:1.2}h2{font-size:22px;margin:0 0 4px}h3{font-size:16px;margin:26px 0 10px}
.lead{color:var(--mut);max-width:920px;margin:4px 0}.kick{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.card h4{margin:0 0 6px;font-size:13px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.nat{background:#dbeafe;color:#1d4ed8}.pill.den{background:#ede9fe;color:#6d28d9}.pill.htm{background:#ffedd5;color:#c2410c}
.pill.pq{background:#fef3c7;color:#92400e}.pill.col{background:#dcfce7;color:#166534}.pill.tbl{background:#e0f2fe;color:#075985}.pill.dis{background:#fce7f3;color:#9d174d}
.nb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700}
.nb.nat{background:var(--nat)}.nb.den{background:var(--den)}.nb.htm{background:var(--htm)}
pre{background:#0b1020;color:#dbe4ff;padding:12px 14px;border-radius:8px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;margin:8px 0 0}
details{margin-top:6px}summary{cursor:pointer;color:#2563eb;font-size:12.5px;font-weight:600}code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:12px}
.hero{background:linear-gradient(135deg,#0b1020,#14213d);color:#e6e9f2;border-radius:16px;padding:26px 28px}.hero .lead{color:#b7c2dc}.hero .kick{color:#2dd4bf}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.how div{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#cfd8ee}.how b{display:block;color:#fff}
@media(max-width:900px){.how{grid-template-columns:1fr 1fr}}
.arc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.arc div{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut)}.arc b{display:block;color:var(--ink);font-size:12.5px}
@media(max-width:900px){.arc{grid-template-columns:1fr 1fr}}
.pc{cursor:pointer}.pc:hover{border-color:#2dd4bf}.pc .q{color:var(--mut);font-size:12.5px;margin:2px 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th{background:#f8fafc;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;color:var(--mut)}table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.sm{font-size:11.5px;margin-top:6px}.sm th,.sm td{padding:4px 8px!important}
.fb2{display:flex;gap:6px;margin:10px 0}.fb2 button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}.fb2 button.on{background:#0f172a;color:#fff}
.pagehead{margin-bottom:12px}.vcount{font-size:12.5px;color:var(--mut);margin-top:6px}
.cw{overflow-x:auto;border-radius:14px}.canvas{min-width:1224px;background:#0b1020;border:1px solid #1b2440;border-radius:14px;padding:14px;color:#e6e9f2}
.ctop{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 12px}.ctitle{font-size:18px;font-weight:700}.csub{font-size:11.5px;color:#8b95b0}
.pnav{display:flex;gap:4px}.pnav span{width:24px;height:24px;border-radius:7px;background:#131a2e;border:1px solid #222c47;display:grid;place-items:center;font-size:11px;color:#b5c0dc;cursor:pointer}.pnav span.on{background:#2dd4bf;color:#042f2e;font-weight:700}
.cg{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.v{position:relative;background:#131a2e;border:1px solid #222c47;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.vh{font-size:11.5px;font-weight:600;color:#c9d1e6;margin:0 0 4px 22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:56px}
.vb{flex:1;min-height:0;overflow:hidden;position:relative}
.no{position:absolute;left:7px;top:7px;width:16px;height:16px;border-radius:50%;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#fff}
.tg{position:absolute;right:8px;top:8px;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:99px}
.nat .no{background:var(--nat)}.den .no{background:var(--den)}.htm .no{background:var(--htm)}
.nat .tg{background:#1e3a8a;color:#bfdbfe}.den .tg{background:#4c1d95;color:#ddd6fe}.htm .tg{background:#7c2d12;color:#fed7aa}
.srow{display:flex;gap:22px;flex-wrap:wrap}.sg{display:flex;flex-direction:column;gap:4px}.sl{font-size:9.5px;text-transform:uppercase;color:#8b95b0}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:3px 10px;border-radius:99px;border:1px solid #2c3760;background:#0f1730;color:#b5c0dc;font-size:11px;cursor:pointer;user-select:none}.chip.on{background:#2dd4bf;color:#042f2e;border-color:#2dd4bf;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:100%}.tile{border:1px solid #2c3760;border-radius:8px;padding:6px 10px;background:#0f1730;cursor:pointer;display:flex;flex-direction:column;justify-content:center}.tile b{font-size:11.5px}.tile span{font-size:10px;color:#8b95b0}.tile.on{background:#0f766e;border-color:#2dd4bf}
.hl{height:100%;display:flex;flex-direction:column;justify-content:center;gap:4px}.hl .e{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#2dd4bf;font-weight:700}.hl .h{font-size:19px;font-weight:700;line-height:1.2}.hl .c{font-size:12px;color:#b5c0dc}
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;height:100%}.k{background:#0f1730;border:1px solid #1d2749;border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.k .l{font-size:9.5px;color:#8b95b0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k .n{font-size:20px;font-weight:700}.k .s{font-size:10px;color:#9aa6c4}
.up{color:#34d399}.dn{color:#fb7185}
.ml{display:flex;flex-direction:column;gap:3px;height:100%}.mr{font-size:10.5px;padding:2px 8px;border-radius:6px;background:#0f1730;border:1px solid #1d2749;color:#b5c0dc;cursor:pointer;flex:1;display:flex;align-items:center;white-space:nowrap;overflow:hidden}.mr.on{background:#134e4a;border-color:#2dd4bf;color:#fff;font-weight:600}
table.ct{width:100%;border-collapse:collapse;font-size:10.5px}.ct th{color:#8b95b0;text-align:left;padding:3px 6px;border-bottom:1px solid #222c47;text-transform:uppercase;font-size:9px}.ct td{padding:4px 6px;border-bottom:1px solid #1a2342;white-space:nowrap}.ct .r{text-align:right}.ct tr.tot td{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fr{display:grid;grid-template-columns:84px 1fr 44px 44px;align-items:center;gap:6px;font-size:10.5px;margin:3px 0}.ft{background:#0f1730;border-radius:4px;height:14px}.fb{height:100%;border-radius:4px}
.ctrl{display:flex;flex-direction:column;gap:14px}.sl2 span{font-size:11px;color:#b5c0dc}.sl2 b{float:right;color:#2dd4bf}.sl2 input{width:100%;accent-color:#2dd4bf}
.big{font-size:32px;font-weight:800;line-height:1}.txt{font-size:12px;color:#b5c0dc;line-height:1.5}
.btn{background:#2dd4bf;color:#042f2e;border:0;border-radius:8px;padding:5px 12px;font-weight:700;font-size:11.5px;cursor:pointer}
.notes{margin-top:14px}.notes ul{margin:4px 0 0;padding-left:18px;font-size:12.5px}.mock{font-size:11.5px;color:var(--mut)}
.erd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}.erd svg{min-width:900px;width:100%}
</style></head><body>
<header><div class="hd"><div class="brand">Maven Fuzzy Factory<small>Power BI storybook · mockup blueprint</small></div><nav id="nav"></nav></div></header>
<main id="main">
<section class="tab" id="overview"></section>
<section class="tab" id="model"></section>
<section class="tab" id="disc"></section>
</main>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const C={line:'#222c47',txt:'#e6e9f2',mut:'#8b95b0',teal:'#2dd4bf',blue:'#60a5fa',cyan:'#22d3ee',vio:'#a78bfa',green:'#34d399',amber:'#fbbf24',coral:'#fb7185',slate:'#64748b'};
const nf=v=>{const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(2)+'M':a>=1e3?(v/1e3).toFixed(a>=1e5?0:1)+'K':''+Math.round(v)};
const usd=v=>'$'+nf(v),usd2=v=>'$'+v.toFixed(2),pc=(v,d=1)=>(v*100).toFixed(d)+'%',int=v=>Math.round(v).toLocaleString('en-US');
const sg=(v,f)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v)),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let W=400,H=170;
const svg=g=>`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block" font-size="10">${g}</svg>`;
const T=(x,y,s,a='start',f=C.mut,z=10,w=400)=>`<text x="${x}" y="${y}" text-anchor="${a}" fill="${f}" font-size="${z}" font-weight="${w}">${s}</text>`;
const dot=c=>`<span class="dot" style="background:${c}"></span>`;
const leg=(it,x,y)=>{let o='';it.forEach(([n,c])=>{o+=`<circle cx="${x+4}" cy="${y-3}" r="4" fill="${c}"/>`+T(x+12,y,n);x+=n.length*5.5+26});return o};
const grid=(m,lo,hi,fm,Y)=>{let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.line}"/>`+T(m.l-4,Y(v)+3,fm(v),'end')}return g};
const R=s=>{const x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};

function line(o){const n=o.labels.length,m={l:o.ml||38,r:8,t:8,b:o.series.length>1?32:18},iw=W-m.l-m.r,ih=H-m.t-m.b,fm=o.fmt||nf;
 let S=o.series.map(s=>s.d);
 if(o.stack){const cum=Array(n).fill(0),tot=o.labels.map((_,i)=>S.reduce((a,d)=>a+d[i],0));S=S.map(d=>d.map((v,i)=>cum[i]+=o.stack==='pct'?v/tot[i]:v))}
 const all=S.flat().filter(v=>v!=null);let lo=o.zero===false?Math.min(...all)*.92:Math.min(0,...all),hi=o.stack==='pct'?1:Math.max(...all)*1.08;
 const X=i=>m.l+i*iw/(n-1),Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;let g=grid(m,lo,hi,o.stack==='pct'?v=>pc(v,0):fm,Y);
 (o.bands||[]).forEach(b=>{g+=`<rect x="${X(b.a)}" y="${m.t}" width="${X(b.b)-X(b.a)}" height="${ih}" fill="${b.c}" opacity="${b.op}"/>`+T((X(b.a)+X(b.b))/2,m.t+10,b.l,'middle',b.c,9,700)});
 o.labels.forEach((l,i)=>{if(i%Math.ceil(n/7)===0)g+=T(X(i),m.t+ih+13,l,'middle')});
 S.forEach((d,k)=>{const s=o.series[k];let p='';d.forEach((v,i)=>{if(v!=null)p+=(p?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)});
  if(o.stack){const b=k?S[k-1]:Array(n).fill(0);for(let i=n-1;i>=0;i--)p+=`L${X(i)},${Y(b[i])}`;g+=`<path d="${p}Z" fill="${s.c}" opacity=".85"/>`}
  else g+=`<path d="${p}" fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="4 3"':''}/>`});
 if(o.series.length>1)g+=leg(o.series.map(s=>[s.n,s.c]),m.l,H-4);return svg(g)}

function bars(o){const n=o.labels.length,fm=o.fmt||nf,ns=o.series.length;let g='';
 if(o.horiz){const m={l:o.ml||80,r:46,t:4,b:4},bh=(H-8)/n,mx=(o.max||Math.max(...o.series[0].d))*1.08,sc=(W-m.l-m.r)/mx;
  o.labels.forEach((l,i)=>{const v=o.series[0].d[i],y=m.t+i*bh;g+=T(m.l-5,y+bh/2+3,l,'end')+`<rect x="${m.l}" y="${y+bh*.15}" width="${v*sc}" height="${bh*.7}" rx="2" fill="${(o.colors||[])[i]||o.series[0].c}"/>`+T(m.l+v*sc+4,y+bh/2+3,(o.lab||fm)(v),'start',C.txt)});
  if(o.ref)g+=`<line x1="${m.l+o.ref.v*sc}" x2="${m.l+o.ref.v*sc}" y1="${m.t}" y2="${H-m.b}" stroke="${C.amber}" stroke-dasharray="4 3"/>`+T(m.l+o.ref.v*sc+3,m.t+9,o.ref.l,'start',C.amber,9);
  return svg(g)}
 const m={l:o.ml||38,r:8,t:o.note?24:14,b:ns>1?32:18},iw=W-m.l-m.r,ih=H-m.t-m.b,band=iw/n;
 const mx=(o.max||Math.max(...o.series.flatMap(s=>s.d)))*1.1,Y=v=>m.t+ih-v/mx*ih;g=grid(m,0,mx,fm,Y);
 o.labels.forEach((l,i)=>{g+=T(m.l+i*band+band/2,m.t+ih+13,l,'middle');o.series.forEach((s,k)=>{const bw=band*.7/ns,v=s.d[i],x=m.l+i*band+band*.15+k*bw,c=(s.colors||[])[i]||s.c;
  g+=`<rect x="${x}" y="${Y(v)}" width="${bw*.92}" height="${m.t+ih-Y(v)}" rx="2" fill="${c}"/>`+T(x+bw*.46,Y(v)-3,(o.lab||fm)(v),'middle',C.txt,9.5)})});
 if(o.ref)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(o.ref.v)}" y2="${Y(o.ref.v)}" stroke="${C.amber}" stroke-dasharray="4 3"/>`+T(W-m.r-2,Y(o.ref.v)-4,o.ref.l,'end',C.amber,9);
 if(o.note)g+=T(W/2,14,o.note,'middle',C.teal,11,700);
 if(ns>1)g+=leg(o.series.map(s=>[s.n,s.c]),m.l,H-4);return svg(g)}

function combo(o){const n=o.labels.length,m={l:42,r:10,t:16,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b,band=iw/n,bm=Math.max(...o.bars)*1.15,lm=Math.max(...o.line)*1.35;let g=grid(m,0,bm,usd,v=>m.t+ih-v/bm*ih);
 o.bars.forEach((v,i)=>{const h=v/bm*ih,x=m.l+i*band+band*.2;g+=`<rect x="${x}" y="${m.t+ih-h}" width="${band*.6}" height="${h}" rx="2" fill="${C.blue}" opacity=".85"/>`+T(x+band*.3,m.t+ih+13,o.labels[i],'middle')});
 let p='';o.line.forEach((v,i)=>{const x=m.l+i*band+band/2,y=m.t+ih-v/lm*ih;p+=(i?'L':'M')+x+','+y});g+=`<path d="${p}" fill="none" stroke="${C.amber}" stroke-width="2"/>`;
 o.line.forEach((v,i)=>{const x=m.l+i*band+band/2,y=m.t+ih-v/lm*ih;g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${C.amber}"/>`+T(x,y-7,pc(v,2),'middle',C.amber,10,700)});return svg(g)}

function waterfall(o){const n=o.items.length,m={t:18,b:30},iw=W-16,ih=H-m.t-m.b;let run=0;const B=[];
 o.items.forEach(it=>{if(it.tot){B.push({a:0,b:it.v,t:'tot',n:it.n,v:it.v});run=it.v}else{B.push({a:run,b:run+it.v,t:it.v>=0?'up':'dn',n:it.n,v:it.v});run+=it.v}});
 const all=B.flatMap(b=>[b.a,b.b]),hi=Math.max(...all)*1.08,lo=o.lo!=null?o.lo:0,Y=v=>m.t+ih-(Math.max(v,lo)-lo)/(hi-lo)*ih,band=iw/n,bw=band*.62,fm=o.fmt||usd,col={tot:C.blue,up:C.green,dn:C.coral};let g='';
 B.forEach((b,i)=>{const x=8+i*band+(band-bw)/2,top=Y(Math.max(b.a,b.b)),bot=Y(Math.min(b.a,b.b));g+=`<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(bot-top,1.5)}" rx="2" fill="${col[b.t]}"/>`+T(x+bw/2,top-4,b.t==='tot'?fm(b.v):sg(b.v,fm),'middle',C.txt,10,600)+T(x+bw/2,H-m.b+13,b.n,'middle',C.mut,9.5)});
 if(o.lo)g+=T(W-6,H-2,'axis truncated','end','#475569',9);return svg(g)}

function heat(o){const nr=o.rows.length,nc=o.cols.length,m={l:o.ml||64,t:16,r:4,b:4},cw=(W-m.l-m.r)/nc,ch=(H-m.t-m.b)/nr,fm=o.fmt||nf,vs=o.data.flat().filter(v=>v!=null),lo=Math.min(...vs),hi=Math.max(...vs),rgb=o.rgb||[45,212,191],a=[19,26,46];let g='';
 o.cols.forEach((c,j)=>g+=T(m.l+j*cw+cw/2,11,c,'middle'));
 o.rows.forEach((r,i)=>{g+=T(m.l-6,m.t+i*ch+ch/2+3,r,'end');o.data[i].forEach((v,j)=>{const x=m.l+j*cw+1,y=m.t+i*ch+1;
  if(v==null){g+=`<rect x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="3" fill="none" stroke="#222c47" stroke-dasharray="2 3"/>`;return}
  const t=(v-lo)/(hi-lo||1),c=a.map((q,k)=>Math.round(q+(rgb[k]-q)*(.12+.88*t))).join(',');g+=`<rect x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="3" fill="rgb(${c})"/>`+T(x+cw/2,y+ch/2+3,fm(v),'middle',t>.55?'#0b1020':C.txt,9.5,600)})});return svg(g)}

function scatter(o){const m={l:42,r:14,t:10,b:24},iw=W-m.l-m.r,ih=H-m.t-m.b,xs=o.pts.map(p=>p.x),ys=o.pts.map(p=>p.y),x0=o.x0??Math.min(...xs)*.9,x1=o.x1??Math.max(...xs)*1.1,y0=o.y0??Math.min(...ys)*.85,y1=o.y1??Math.max(...ys)*1.12,lg=o.log;
 const X=v=>m.l+((lg?Math.log10(v/x0):(v-x0))/(lg?Math.log10(x1/x0):(x1-x0)))*iw,Y=v=>m.t+ih-(v-y0)/(y1-y0)*ih;let g=grid(m,y0,y1,o.yf,Y);
 for(let k=0;k<=3;k++){const v=lg?x0*Math.pow(x1/x0,k/3):x0+(x1-x0)*k/3;g+=T(X(v),H-8,o.xf(v),'middle')}

 ['Verdict card (HTML Content)',`Verdict HTML =\nVAR z = [Billing Z-Score]\nRETURN "<div style='font-family:Segoe UI;color:#e6e9f2'>"\n & "<div style='font-size:32px;font-weight:800;color:#34d399'>+" & FORMAT([Billing Lift pp], "0.00") & " pp</div>"\n & "<div style='font-size:12px'>z = " & FORMAT(z, "0.0") & " · " & IF(ABS(z) >= 1.96, "significant at 95%", "not significant") & "</div></div>"`]],

const OBJ=[
['Fact_Sessions','Channel Grouping · Traffic Type','pq','Single source of truth for acquisition; text key to Dim_Channel.','P1–P5',`Channel Grouping =\nif [utm_source] = null and [http_referer] = null then "Direct"\nelse if [utm_source] = null then "Organic Search"\nelse if [utm_source] = "gsearch" and [utm_campaign] = "brand" then "Google Brand"\nelse if [utm_source] = "gsearch" and [utm_campaign] = "nonbrand" then "Google Nonbrand"\nelse if [utm_source] = "bsearch" and [utm_campaign] = "brand" then "Bing Brand"\nelse if [utm_source] = "bsearch" and [utm_campaign] = "nonbrand" then "Bing Nonbrand"\nelse if [utm_source] = "socialbook" then "Paid Social" else "Other"\n\nTraffic Type = if [Channel Grouping] = "Direct" then "Direct"\n  else if [Channel Grouping] = "Organic Search" then "Organic" else "Paid"`],
['Fact_Sessions','Session Date · Visit Type','pq','Date key (date only) and New/Repeat label.','All',`Session Date = Date.From([created_at])\nVisit Type   = if [is_repeat_session] = 1 then "Repeat" else "New"`],
['Fact_Sessions','Landing Page · Pageviews · Is Bounce · Funnel Depth · Billing Variant','pq','Session-level flags computed once from Fact_Pageviews so funnel and CRO measures stay simple and fast.','P3, P5',`// On Fact_Pageviews add [Funnel Step]:\nif [pageview_url] = "/home" or Text.StartsWith([pageview_url], "/lander") then 1\nelse if [pageview_url] = "/products" then 2\nelse if Text.StartsWith([pageview_url], "/the-") then 3\nelse if [pageview_url] = "/cart" then 4\nelse if [pageview_url] = "/shipping" then 5\nelse if Text.StartsWith([pageview_url], "/billing") then 6\nelse if [pageview_url] = "/thank-you-for-your-order" then 7 else null\n\n// Group by website_session_id, merge into Fact_Sessions\nTable.Group(Fact_Pageviews, {"website_session_id"}, {\n {"Landing Page", each Table.Sort(_, {"website_pageview_id", Order.Ascending}){0}[pageview_url]},\n {"Pageviews", each Table.RowCount(_)},\n {"Funnel Depth", each List.Max([Funnel Step])},\n {"Billing Variant", each if List.Contains([pageview_url], "/billing-2") then "billing-2"\n      else if List.Contains([pageview_url], "/billing") then "billing" else null}})\n// Is Bounce = if [Pageviews] = 1 then 1 else 0`],
['Fact_Sessions','Days Since First Session','col','Time-to-return histogram.','P5',`Days Since First Session =\nVAR first = CALCULATE(MIN(Fact_Sessions[Session Date]), ALLEXCEPT(Fact_Sessions, Fact_Sessions[user_id]))\nRETURN DATEDIFF(first, Fact_Sessions[Session Date], DAY)`],
['Fact_Orders','Order Date','pq','Date key.','All',`Order Date = Date.From([created_at])`],
['Fact_Orders','Order Seq · Is Repeat Order','col','Which purchase this is for the user; basis of repeat-order measures.','P5',`Order Seq =\nVAR o = Fact_Orders[order_id]\nRETURN CALCULATE(COUNTROWS(Fact_Orders), ALLEXCEPT(Fact_Orders, Fact_Orders[user_id]), Fact_Orders[order_id] <= o)\n\nIs Repeat Order = IF(Fact_Orders[Order Seq] > 1, 1, 0)`],
['Fact_Orders','First Order Date · Cohort Month · Months Since First','col','Cohort heatmap axes.','P5',`First Order Date = CALCULATE(MIN(Fact_Orders[Order Date]), ALLEXCEPT(Fact_Orders, Fact_Orders[user_id]))\nCohort Month = DATE(YEAR([First Order Date]), MONTH([First Order Date]), 1)\nMonths Since First = DATEDIFF([Cohort Month], DATE(YEAR([Order Date]), MONTH([Order Date]), 1), MONTH)`],
['Fact_Orders','Basket Type','col','1 item vs 2 items.','P4',`Basket Type = IF(Fact_Orders[items_purchased] = 1, "1 item", "2 items")`],
['Fact_OrderItems','Item Role · Primary Product ID · Pair Label','col','Separates primary vs add-on and names each pairing for the heatmap.','P4',`Item Role = IF(Fact_OrderItems[is_primary_item] = 1, "Primary", "Cross-sell")\nPrimary Product ID = RELATED(Fact_Orders[primary_product_id])\nPair Label =\nIF(Fact_OrderItems[is_primary_item] = 0,\n   LOOKUPVALUE(Dim_Product[product_name], Dim_Product[product_id], [Primary Product ID])\n   & " → " & RELATED(Dim_Product[product_name]))`],
['Fact_Refunds','Refund Date (PQ) · Order Date · Refund Lag Days · Lag Bucket','col','Order Date powers the inactive relationship (cohort view); lag drives the histogram.','P6',`Refund Date = Date.From([created_at])   // Power Query\n\nOrder Date = RELATED(Fact_OrderItems[Order Date])\nRefund Lag Days = DATEDIFF(Fact_Refunds[Order Date], Fact_Refunds[Refund Date], DAY)\nLag Bucket = SWITCH(TRUE(), [Refund Lag Days] <= 5, "2–5 d", [Refund Lag Days] <= 10, "6–10 d", "11–16 d")`],
['Dim_Date','Dim_Date (calculated table)','tbl','Date table with chapter mapping and partial-month flag. Mark as date table.','All',`Dim_Date =\nADDCOLUMNS(\n  CALENDAR(DATE(2012,3,1), DATE(2015,3,31)),\n  "Year", YEAR([Date]), "Quarter", "Q" & QUARTER([Date]),\n  "Month #", MONTH([Date]), "Month", FORMAT([Date], "MMM"),\n  "Month Start", DATE(YEAR([Date]), MONTH([Date]), 1),\n  "Is Weekend", WEEKDAY([Date], 2) > 5,\n  "Is Partial Month", [Date] >= DATE(2015, 3, 1),\n  "Chapter ID", SWITCH(TRUE(),\n      [Date] <= DATE(2012,8,31), 1, [Date] <= DATE(2012,12,31), 2,\n      [Date] <= DATE(2014,1,31), 3, [Date] <= DATE(2014,12,31), 4, 5))`],
['Dim_Channel','Dim_Channel (calculated table)','tbl','Channel dimension with campaign type and colour (read by Deneb).','P2, P5',`Dim_Channel =\nDATATABLE("Channel Grouping", STRING, "Traffic Type", STRING, "Campaign Type", STRING, "Color", STRING,\n{ {"Google Nonbrand","Paid","Nonbrand","#60A5FA"}, {"Bing Nonbrand","Paid","Nonbrand","#22D3EE"},\n  {"Google Brand","Paid","Brand","#A78BFA"}, {"Bing Brand","Paid","Brand","#C4B5FD"},\n  {"Paid Social","Paid","Social","#FB7185"}, {"Organic Search","Organic","Organic","#34D399"},\n  {"Direct","Direct","Direct","#FBBF24"} })`],

['Dim_Landing','Dim_Landing (calculated table)','tbl','Landing-page dimension with test role.','P3',`Dim_Landing =\nDATATABLE("Landing Page", STRING, "Test Role", STRING,\n{ {"/home","Baseline"}, {"/lander-1","Challenger"}, {"/lander-2","Challenger"},\n  {"/lander-3","Challenger"}, {"/lander-4","Challenger"}, {"/lander-5","Challenger"} })`],
['Dim_User','Dim_User (calculated table) · User Segment','tbl','One row per visitor (394K rows: prefer Power Query).','P5',`Dim_User =\nADDCOLUMNS(SUMMARIZE(Fact_Sessions, Fact_Sessions[user_id]),\n  "First Session", CALCULATE(MIN(Fact_Sessions[Session Date])),\n  "Orders", CALCULATE(COUNTROWS(Fact_Orders)))\n\nUser Segment = SWITCH(TRUE(), [Orders] = 0, "Browser", [Orders] = 1, "One-time buyer", "Repeat buyer")`],

['_Param_MetricSelector','P1','One slicer swaps any trend or bar between 10 lenses, with the right number format.',['MetricID','MetricName','Category'],[[1,'Gross Revenue ($)','Financial'],[2,'Net Revenue ($)','Financial'],[3,'Gross Margin ($)','Financial'],[4,'Gross Margin %','Financial'],[5,'Total Orders','Volume'],[6,'Total Sessions','Traffic'],[7,'Conversion Rate %','Efficiency'],[8,'Average Order Value ($)','Basket'],[9,'Cross-Sell Attach %','Basket'],[10,'Refund Rate %','Quality']],
`_Param_MetricSelector =\nDATATABLE("MetricID", INTEGER, "MetricName", STRING, "Category", STRING,\n{ {1,"Gross Revenue ($)","Financial"}, {2,"Net Revenue ($)","Financial"}, {3,"Gross Margin ($)","Financial"},\n  {4,"Gross Margin %","Financial"}, {5,"Total Orders","Volume"}, {6,"Total Sessions","Traffic"},\n  {7,"Conversion Rate %","Efficiency"}, {8,"Average Order Value ($)","Basket"},\n  {9,"Cross-Sell Attach %","Basket"}, {10,"Refund Rate %","Quality"} })\n\nDynamic Selected Metric =\nSWITCH(SELECTEDVALUE(_Param_MetricSelector[MetricID], 1),\n  1, [Gross Revenue], 2, [Net Revenue], 3, [Gross Profit], 4, [Gross Margin %], 5, [Total Orders],\n  6, [Total Sessions], 7, [Conversion Rate %], 8, [Average Order Value], 9, [Cross-Sell Attach Rate %],\n  10, [Refund Rate %], [Gross Revenue])\n\n-- Format string expression on [Dynamic Selected Metric]:\nSWITCH(SELECTEDVALUE(_Param_MetricSelector[MetricID], 1),\n  1, "$#,0", 2, "$#,0", 3, "$#,0", 4, "0.0%", 5, "#,0", 6, "#,0", 7, "0.00%", 8, "$#,0.00", 9, "0.0%", 10, "0.0%", "$#,0")`],
['_Param_TimeIntelligence','P1','Compare periods without duplicating visuals.',['TimeModeID','TimeModeName'],MODES.map((m,i)=>[i+1,m]),
`Time Mode Value =\nVAR m   = SELECTEDVALUE(_Param_TimeIntelligence[TimeModeID], 1)\nVAR cur = [Dynamic Selected Metric]\nVAR pp  = CALCULATE([Dynamic Selected Metric], DATEADD(Dim_Date[Date], -1, MONTH))\nVAR py  = CALCULATE([Dynamic Selected Metric], SAMEPERIODLASTYEAR(Dim_Date[Date]))\nVAR r30 = CALCULATE([Dynamic Selected Metric], DATESINPERIOD(Dim_Date[Date], MAX(Dim_Date[Date]), -30, DAY))\nRETURN SWITCH(m, 1, cur, 2, pp, 3, py, 4, cur - py, 5, DIVIDE(cur - py, py), r30)\n-- Mode 5 needs a "0.0%" format: have the metric's format string return it when m = 5.`],
['_Param_DimensionSlicer (axis bridge)','P2','Swap matrix rows and chart axes between channel, device, product, landing page and campaign. TREATAS applies the selected members to the right dimension.',['DimID','DimName','Member'],[[1,'Marketing Channel','Google Nonbrand'],[2,'Device','desktop'],[3,'Product','Mr. Fuzzy'],[4,'Landing Page','/lander-5'],[5,'Campaign','Brand']],
`_Param_DimensionSlicer =\nUNION(\n  SELECTCOLUMNS(Dim_Channel, "DimID", 1, "DimName", "Marketing Channel", "Member", Dim_Channel[Channel Grouping]),\n  SELECTCOLUMNS(VALUES(Fact_Sessions[device_type]), "DimID", 2, "DimName", "Device", "Member", Fact_Sessions[device_type]),\n  SELECTCOLUMNS(Dim_Product, "DimID", 3, "DimName", "Product", "Member", Dim_Product[product_name]),\n  SELECTCOLUMNS(Dim_Landing, "DimID", 4, "DimName", "Landing Page", "Member", Dim_Landing[Landing Page]),\n  SELECTCOLUMNS(DISTINCT(Dim_Channel[Campaign Type]), "DimID", 5, "DimName", "Campaign", "Member", Dim_Channel[Campaign Type]))\n\nDyn Axis Metric =\nVAR d = SELECTEDVALUE(_Param_DimensionSlicer[DimID], 1)   -- slicer on DimName, single-select\nVAR members = VALUES(_Param_DimensionSlicer[Member])\nRETURN SWITCH(d,\n  1, CALCULATE([Dynamic Selected Metric], TREATAS(members, Dim_Channel[Channel Grouping])),\n  2, CALCULATE([Dynamic Selected Metric], TREATAS(members, Fact_Sessions[device_type])),\n  3, CALCULATE([Dynamic Selected Metric], TREATAS(members, Dim_Product[product_name])),\n  4, CALCULATE([Dynamic Selected Metric], TREATAS(members, Dim_Landing[Landing Page])),\n  5, CALCULATE([Dynamic Selected Metric], TREATAS(members, Dim_Channel[Campaign Type])))\n-- Session-grain metrics are undefined for Product: return BLANK() in branch 3 for those.\n-- For native-only visuals a Field Parameter is the simpler alternative.`],
